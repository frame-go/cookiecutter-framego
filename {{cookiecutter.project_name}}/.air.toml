root = "."
tmp_dir = "tmp"

[build]
cmd = "make build"
entrypoint = "./bin/{{ cookiecutter.app_package_name }}"
args_bin = ["-c", "./configs/debug/config.yaml"]
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "proto"]
exclude_dir = ["data", "assets", "tmp", "vendor", "frontend/node_modules"]
include_dir = []
exclude_file = []
log = "air.log"
delay = 10000 # ms
stop_on_error = true
send_interrupt = false
kill_delay = 1000 # ms

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
