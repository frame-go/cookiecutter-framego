version: v1
plugins:
  - name: go
    path: ["go", "tool", "google.golang.org/protobuf/cmd/protoc-gen-go"]
    out: .
    opt:
      - paths=source_relative
  - name: validate
    path: ["go", "tool", "github.com/envoyproxy/protoc-gen-validate"]
    out: .
    opt:
      - paths=source_relative
      - lang=go
  - name: go-grpc
    path: ["go", "tool", "google.golang.org/grpc/cmd/protoc-gen-go-grpc"]
    out: .
    opt:
      - paths=source_relative
  - name: grpc-gateway
    path: ["go", "tool", "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway"]
    out: .
    opt:
      - paths=source_relative
  - name: openapiv2
    path: ["go", "tool", "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2"]
    out: .
    opt:
      - json_names_for_fields=false
      - enums_as_ints=true
      - openapi_naming_strategy=simple
  - name: framego
    path: ["go", "tool", "github.com/frame-go/protoc-gen-framego"]
    out: .
    opt:
      - paths=source_relative
